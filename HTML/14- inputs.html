<!--inputs-->

<!--label permite colocar mais coisas nos inputs-->

<!--autocomplete, completa automaticamente o input, dependendo do que estiver pedindo-->
<!--placeholder é o que fica dentro da caixa, mostrando o que deve ser colocado-->
<label>
        Rua:
        <input autocomplete="street-address" 
        placeholder="Digite sua rua"
        />

</label>

<!--podemos usar o for e o id, sao como variaveis, usa pra nao precisar fazer uma estrutura tao grande e facilida o trabalho-->

<label for="rua">Rua</label>
<input id="rua" > <!--autofocus-->
